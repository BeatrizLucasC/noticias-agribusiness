name: Atualização semanal de notícias agribusiness

on:
  schedule:
    - cron: '0 9 * * MON'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar gerador de notícias
        run: python main.py

      - name: Commit and push updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add index.html history.json
            git commit -m "Atualização semanal de notícias agribusiness"
            git push
          else
            echo "Sem alterações para commitar."
          fi
